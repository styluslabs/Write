name: Write CI

# Release builds for Linux (tgz), Windows (zip) and Android (APK), uploaded as artifacts
# - no SDL: all platforms use ugui platform layers (ugui/platforms/)
# - fetch-depth: 0 since package version / filename uses commit count (GITCOUNT in Makefile)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Checkout submodules
      run: git submodule update --init stb pugixml miniz nanovgXC ulib usvg ugui
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxi-dev libxext-dev libxcursor-dev libxrandr-dev libgl-dev libopengl-dev libglx-dev libcurl4-openssl-dev
    - name: Build Write
      working-directory: syncscribble
      run: make -j$(nproc) DEBUG=0 real_tgz
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ failure() }}
      timeout-minutes: 15
    - name: Upload release tgz
      uses: actions/upload-artifact@v4
      with:
        name: release-22_04-tgz
        path: syncscribble/Release/*.tar.gz

  windows-build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Checkout submodules
      run: git submodule update --init stb pugixml miniz nanovgXC ulib usvg ugui
    - name: Download make.exe
      run: curl -L -o make.exe https://github.com/styluslabs/maps/releases/download/alpha-1/make.exe
    - name: MSVC command prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build Write
      shell: cmd
      working-directory: syncscribble
      run: ..\make.exe SHELL=cmd.exe DEBUG=0 zip
    # SSH session to debug workflow
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ failure() }}
      timeout-minutes: 15
    - name: Upload release ZIP
      uses: actions/upload-artifact@v4
      with:
        name: release-win64-zip
        path: syncscribble/Release/*.zip

  android-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Checkout submodules
      run: git submodule update --init stb pugixml miniz nanovgXC ulib usvg ugui
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Gradle Assemble
      run: ./gww assembleRelease
      working-directory: syncscribble/android
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ failure() }}
      timeout-minutes: 15
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: syncscribble/android/app/build/outputs/apk/release/app-release.apk
