# Example nginx config for a public whiteboard server (`Write --server`) w/ TLS and HTTP Basic auth
#
# nginx handles TLS and checks passwords; Write's server (which has no authentication of its own) only listens
#  on localhost and takes the user name from the X-Remote-User header set by nginx (--trust-proxy)
#
# 1. Run the whiteboard server (e.g. as a systemd service):
#      Write --server --host=127.0.0.1 --port=7000 --trust-proxy
#    --host=127.0.0.1 is required w/ --trust-proxy: anyone who can connect directly could set X-Remote-User.
#    The raw relay on port 7001 (for old Write versions) is then unreachable from outside, so only Write versions
#    w/ the HTTP relay (and HTTP Basic auth support) can connect.
#
# 2. Create password file w/ one line per user:
#      Write --server --htpasswd-line=alice >> /etc/nginx/write-htpasswd
#    (prompts for alice's password). Write never sends the plain password - it sends md5("styluslabs" + password)
#    as the Basic auth password, so the htpasswd entry must be for that value. Without Write, e.g. w/ apache2-utils:
#      printf 'styluslabs%s' "$PASSWORD" | md5sum | cut -d' ' -f1 | htpasswd -i -m /etc/nginx/write-htpasswd alice
#    (-m: apr1 hash, as --htpasswd-line uses, which nginx supports itself; bcrypt (-B) depends on system crypt())
#    nginx re-reads the file for each request, so no reload is needed after adding users.
#    (Caddy: `basic_auth` needs bcrypt - use `caddy hash-password --plaintext <md5 value>`)
#
# 3. In Write, use https:// links:
#      https://whiteboard.example.com/<whiteboard id>
#    or set Preferences > Advanced > Whiteboard server to https://whiteboard.example.com so plain whiteboard ids
#    use it. User and password are entered in Write's login dialog (or in the link: https://user:pass@host/id).
#    Write only sends Basic auth credentials over https (or plain http to localhost).

# This file goes in http context, e.g. /etc/nginx/conf.d/write-whiteboard.conf

# log format w/o query string (whiteboard tokens and relay session ids are in query strings)
log_format combined_nq '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

upstream write_whiteboard {
  server 127.0.0.1:7000;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name whiteboard.example.com;
  # for certbot (Let's Encrypt) http-01 challenge, if used:
  # location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;  # nginx >= 1.25.1; for older versions, use `listen 443 ssl http2;` instead
  server_name whiteboard.example.com;

  ssl_certificate /etc/letsencrypt/live/whiteboard.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/whiteboard.example.com/privkey.pem;

  # whiteboard data is sent in request bodies (documents w/ images can be large); server limit is 256 MB
  client_max_body_size 256m;

  location / {
    auth_basic "Write whiteboard";
    auth_basic_user_file /etc/nginx/write-htpasswd;

    proxy_pass http://write_whiteboard;
    # keep-alive connections to upstream
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # authenticated user (replaces any X-Remote-User header sent by client)
    proxy_set_header X-Remote-User $remote_user;
    # client address (for server's log)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # whiteboard polls are held for up to 25 s by server, so read timeout must be longer
    proxy_read_timeout 60s;
    access_log /var/log/nginx/write-whiteboard.log combined_nq;
  }
}

# To serve the whiteboard under a path on an existing site instead (link: https://example.com/swb/<id>), use in
#  that site's server block (same directives as above, w/ trailing '/' on proxy_pass to strip the /swb prefix):
#   location /swb/ {
#     auth_basic "Write whiteboard";
#     auth_basic_user_file /etc/nginx/write-htpasswd;
#     proxy_pass http://write_whiteboard/;
#     ...
#   }
